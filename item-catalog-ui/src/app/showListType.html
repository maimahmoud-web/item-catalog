

<tr *ngFor="let item of items">

    <td>{{item.code_number }}</td>
    <td>{{item.name }}</td>
    <td>{{item.price }}</td>
    <td>{{item.type }}</td>

    <td>
        <span *ngIf="item.type === 'service'">
            {{item.durationHours}} h
        </span>

         <span *ngIf="item.type === 'product'">
            {{item.weightKg}} kg
         </span>
    </td>
</tr>
