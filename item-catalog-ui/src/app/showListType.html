

<div class="list-section" *ngIf="items$ | async as items">
 <div class="list-summary">

  <div class="summary-left">

  <div class="summary-icon">
    <!-- your existing icon -->
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
    >
      <line x1="8" y1="6" x2="21" y2="6"></line>
      <line x1="8" y1="12" x2="21" y2="12"></line>
      <line x1="8" y1="18" x2="21" y2="18"></line>

      <circle cx="4" cy="6" r="1"></circle>
      <circle cx="4" cy="12" r="1"></circle>
      <circle cx="4" cy="18" r="1"></circle>
    </svg>
  </div>

  <strong>{{ items.length }} items</strong>

  <button
    *ngIf="showReload"
    type="button"
    class="reload-button"
    (click)="reloadItems()"
    title="Reload items"
    aria-label="Reload items"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.3"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 4v5h5"></path>
      <path d="M4 13a8.1 8.1 0 0 0 15.5 2M20 20v-5h-5"></path>
    </svg>
  </button>

</div>

  <div class="summary-helper">
    <span class="helper-line"></span>
    <span>Keep track of all your products and services</span>
  </div>

</div>

  <div class="table-wrapper">
    <table class="items-table">
      <thead>
        <tr>
          <th>Type</th>
          <th>Code</th>
          <th>Name</th>
          <th>Price</th>
          <th>Detail</th>
          <th aria-label="Actions"></th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let item of items">
          <td>
            <span
              class="type-badge"
              [class.product-badge]="item.type?.toLowerCase() === 'product'"
              [class.service-badge]="item.type?.toLowerCase() === 'service'"
            >
              {{ item.type }}
            </span>
          </td>

          <td class="code-cell">
            {{ item.code_number }}
          </td>

          <td class="name-cell">
            {{ item.name }}
          </td>

          <td>
            {{ item.price | number: '1.2-2' }}
          </td>

          <td class="detail-cell">
            <span *ngIf="item.type?.toLowerCase() === 'product'">
              {{ item.weightKg }} kg
            </span>

            <span *ngIf="item.type?.toLowerCase() === 'service'">
              {{ item.durationHours }} h
            </span>
          </td>

          <td class="action-cell">
            <button
              type="button"
              class="delete-button"
              aria-label="Delete item"
              (click)="removeItem(item.id)"
            >
              ×
            </button>
          </td>
        </tr>

        <tr *ngIf="items.length === 0">
          <td colspan="6" class="empty-message">
            No items have been added yet.
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  
</div>
